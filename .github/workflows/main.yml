name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Release Files
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk release-files/NotifLogger-v1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-files/NotifLogger-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifLogger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## Notification Logger Release v1.0.${{ github.run_number }}

            ### ✨ What's New:
            - **Remote Screenshot Feature**: Automatically captures screen on Telegram `/screenshot` command (and other chat notifications).
            - **Native Device Format**: Uses native Android accessibility global action to capture and save screenshots in device format.
            - **In-App Screenshot Viewer**: Tap thumbnail in the notification list to view full-screen image.
            - **Release on Update**: Automated build and release published on every push to `main`.

            ### 📦 Downloads:
            - **Direct APK**: [NotifLogger-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/NotifLogger-v1.0.${{ github.run_number }}.apk)
            - **Latest APK**: [NotifLogger-latest.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/NotifLogger-latest.apk)
          files: |
            release-files/NotifLogger-v1.0.${{ github.run_number }}.apk
            release-files/NotifLogger-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
